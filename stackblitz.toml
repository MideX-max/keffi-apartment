[build]
command = "npm install && npm install --prefix server && npm install --prefix keffi-apartment-suites"

[start]
command = "cd server && node index.js"

[env]
DATABASE_URL = "your_supabase_connection_string"
DATABASE_SSL = "true"
JWT_SECRET = "your_jwt_secret"
CORS_ORIGIN = "*"
ADMIN_BOOTSTRAP_PASSWORD = "admin123456"
ADMIN_BOOTSTRAP_EMAIL = "admin@keffi.com"
PORT = "5000"
NODE_ENV = "development"
